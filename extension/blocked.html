<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbiDock • Focus Lock Active</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(18, 20, 26, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --text: #f5f7fa;
      --text-muted: #9ca3af;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Ambient glow */
    .glow {
      position: absolute;
      top: -120px;
      width: 500px;
      height: 300px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }
    /* Dynamic Island Top Pill */
    .top-notch {
      position: absolute;
      top: 0;
      padding: 8px 24px;
      background: #000000;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      border: 1px solid var(--border);
      border-top: none;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }
    .top-notch-text {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #f87171;
    }
    /* Main Focus Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 44px 40px;
      width: 540px;
      max-width: 90vw;
      text-align: center;
      backdrop-filter: blur(40px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      z-index: 10;
    }
    .icon-ring {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      font-size: 32px;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.2);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .agenda-box {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 28px;
      text-align: left;
    }
    .agenda-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .agenda-text {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      color: white;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.45);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <!-- Dynamic Island Top Pill -->
  <div class="top-notch">
    <div class="status-dot"></div>
    <span class="top-notch-text">OrbiDock • Focus Lock Active</span>
  </div>

  <div class="card">
    <div class="icon-ring">🛡️</div>
    <h1>Site Locked by OrbiDock</h1>
    <p class="subtitle">
      This URL is outside your active task agenda. OrbiDock keeps your concentration intact until your session completes.
    </p>

    <div class="agenda-box">
      <div class="agenda-label">Current Task Agenda</div>
      <div class="agenda-text" id="agenda-display">Deep Work Session</div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-back">
        <span>↩ Return to Permitted Workspace</span>
      </button>
      <button class="btn btn-secondary" id="btn-break">
        <span>💧 Request 5-Min Water & Eye Break</span>
      </button>
    </div>

    <p class="footer-note">
      Configured via OrbiDock Dynamic Island Notch • Pure Native Control
    </p>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
