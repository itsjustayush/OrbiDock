<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbiDock Companion</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #12141a;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #8b5cf6;
      --text: #f5f7fa;
      --text-muted: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      width: 330px;
      padding: 16px;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-icon {
      width: 22px;
      height: 12px;
      background: #000;
      border: 1.5px solid #8b5cf6;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .conn-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .conn-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }
    .conn-badge.disconnected {
      background: rgba(239, 68, 68, 0.12);
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.25);
    }
    .conn-badge.disconnected .conn-dot {
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .stat-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
    }
    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #8b5cf6 50%, #f43f5e 100%);
      width: 38%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .focus-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .input-field {
      width: 100%;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #fff;
      outline: none;
      margin-bottom: 8px;
    }
    .input-field:focus {
      border-color: var(--accent);
    }
    .btn-toggle-focus {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      background: #8b5cf6;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-toggle-focus:hover {
      opacity: 0.9;
    }
    .btn-toggle-focus.active {
      background: #ef4444;
    }
    .incognito-notice {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      color: #9ca3af;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <div class="pill-icon"></div>
      <span class="title">OrbiDock</span>
    </div>
    <div class="conn-badge" id="conn-badge">
      <div class="conn-dot"></div>
      <span id="conn-text">Syncing...</span>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-header">
      <span>WORKLOAD STRESS SCORE</span>
      <span id="stress-percentage">38%</span>
    </div>
    <div class="stat-value" id="stress-label">Moderate Focus</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="stress-bar" style="width: 38%;"></div>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-header">
      <span>SMART DYNAMIC HYDRATION</span>
      <span id="reminder-mode">Auto (Stress Scaled)</span>
    </div>
    <div class="stat-value" id="water-countdown">~18 mins remaining</div>
  </div>

  <div class="focus-section">
    <div class="section-title">Focus Block & Agenda</div>
    <input type="text" class="input-field" id="agenda-input" placeholder="e.g. OrbiDock Core Architecture" />
    <button class="btn-toggle-focus" id="btn-focus">Start Focus Lock</button>
  </div>

  <div class="incognito-notice" id="incognito-status">
    <span>🕵️</span>
    <span id="incognito-msg">Incognito inspection enabled.</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
